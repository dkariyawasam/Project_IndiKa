name: Expedition Kanto checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev python3 python3-pil
      - name: Install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../
      - name: Check repository distribution rules
        run: python3 tools/check_release_hygiene.py
      - name: Build modified FireRed
        run: make -j"$(nproc)" GAME_VERSION=FIRERED GAME_LANGUAGE=ENGLISH GAME_REVISION=0 COMPARE=0
      - name: Check trainer wiring
        run: python3 tools/audit_trainer_wiring.py
      # Deliberately no ROM uploads, release publishing or branch writes.
